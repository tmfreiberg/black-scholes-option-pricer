project:
  type: website
  output-dir: _site
  # The wheel is built into docs/ by CI before rendering. It has to be copied into the
  # site so that micropip can fetch it at the relative path the front matter names.
  resources:
    - "*.whl"
    - "figures/**"

website:
  title: "bsm-pricer"
  repo-url: https://github.com/tmfreiberg/black-scholes-option-pricer
  repo-actions: [source, issue]
  page-footer: "MIT licensed. Built from the repository on every push to main."

format:
  live-html:
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
