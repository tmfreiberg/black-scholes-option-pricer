name: Publish document

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
      - ".github/actions/render-page/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev

      # The same render the CI workflow runs on every pull request: the version pin,
      # the figures, and the pinned Quarto, quarto-live and Pyodide.
      - uses: ./.github/actions/render-page

      # Deliberately after the render, not before. The render is the step most likely
      # to break and the one hardest to check anywhere else, so it should run even when
      # the version is not yet published; otherwise a broken document stays hidden
      # through the whole window between bumping a version and releasing it.
      - name: Check that version is published on PyPI
        run: |
          version=$(uv run --no-sync python -c "import bsm; print(bsm.__version__)")
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/bsm-pricer/${version}/json")
          if [ "$status" != "200" ]; then
            echo "::error::bsm-pricer ${version} is not on PyPI (HTTP ${status})"
            echo "publish it before deploying, or the page cannot start" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/_site

  # Runs the uploaded site, not a fresh render, so what passes here is byte for byte
  # what gets deployed.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@v4.3.0
        with:
          name: github-pages
          path: artifact
      - name: Unpack the built site
        run: mkdir -p _site && tar -xf artifact/artifact.tar -C _site
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      # Serves the built site and drives a real browser through it. The only test that
      # exercises what a reader meets: the runtime booting, micropip resolving the
      # package from PyPI, and a cell producing the right number.
      - name: Smoke test the built page
        run: uv run --no-sync pytest tests/e2e/test_document.py -v -p no:cacheprovider
        env:
          BSM_SITE_DIR: _site

  # A page that renders but does not run is never deployed.
  deploy:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
