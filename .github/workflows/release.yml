name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra dev

      # Never publish something that does not pass its own gate. A bad release cannot
      # be replaced on PyPI, only yanked, so the checks belong before the upload rather
      # than after it.
      - name: Verify
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src tests
          uv run --no-sync pytest --cov --cov-fail-under=95

      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-sync python -c "import bsm; print(bsm.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${tag} does not match bsm.__version__ ${version}"
            exit 1
          fi

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: distribution
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bsm-pricer
    # Trusted publishing: PyPI verifies this workflow's identity directly, so no API
    # token is stored in the repository at all.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
