name: CI

on:
  push:
    branches: [main, update]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and type-check run once, as their own job, so that a failure here is
  # unambiguous rather than buried in one cell of the test matrix. Both gate every
  # push; neither is advisory.
  static:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Doctests are collected here too, so every example in every docstring is
      # executed on all three supported versions.
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The wheel is pure Python (py3-none-any), which is what lets micropip install it
      # in the browser for the published document. Uploading it here means the Pages
      # workflow can consume the same artifact the tests ran against.
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
