[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bsm-pricer"
version = "0.1.0"
description = "Black-Scholes-Merton option pricing, Greeks, and implied volatility."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tristan Freiberg" }]
keywords = ["black-scholes", "options", "quantitative-finance", "implied-volatility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# NumPy is the only runtime dependency. SciPy is deliberately absent: the normal CDF
# and the root-finder are implemented in this package so that the whole thing loads
# quickly under Pyodide. SciPy appears below as a test-only oracle.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
cli = ["typer>=0.12"]
dev = [
    "bsm-pricer[cli,plot]",
    "hypothesis>=6.100",
    "mpmath>=1.3",       # 50-digit oracle for the accuracy tests
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "scipy>=1.13",       # oracle for the root-finder; never imported by the package
]

[project.scripts]
bsm = "bsm.cli:main"

[project.urls]
Repository = "https://github.com/tmfreiberg/black-scholes-option-pricer"

[tool.hatch.build.targets.wheel]
packages = ["src/bsm"]

# --------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "D",       # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full numpydoc sections there would be
# noise. Everything shipped in src/ must carry a conforming docstring or the lint fails.
"tests/**" = ["D"]

# --------------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------------
[tool.mypy]
# Targets 3.12 even though the package supports 3.11 at runtime: NumPy 2's stubs use
# PEP 695 `type` statements, which mypy cannot parse under a 3.11 target. The test
# suite still runs on 3.11 in CI, so runtime support is verified there.
python_version = "3.12"
strict = true
warn_unreachable = true
# `possibly-undefined` is NOT included in --strict. It is enabled explicitly: a name
# read on a branch where it was never bound is a runtime crash that no test is
# guaranteed to reach, and the checker finds it for nothing.
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# playwright is installed only in the publish workflow, where the browser smoke test
# runs against the built site. It is not part of the library's development set.
module = ["scipy.*", "matplotlib.*", "mpmath.*", "playwright.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# docs/ is excluded: make_figures.py is a build script, not a module under test.
# Doctests are collected and executed. In an earlier project the Examples sections were
# documentation only, so they were free to drift; here every example is a test.
addopts = "--doctest-modules --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/bsm"]
branch = true

[tool.coverage.report]
# @overload stubs have `...` for a body; they are declarations, not code to cover.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
